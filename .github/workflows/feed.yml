name: Publish database

# Rebuilds and publishes the signed database every hour, a failed run publishes nothing and missing secrets only leave a notice.

on:
  # GitHub runs schedules hours late on small repositories, so the hourly rhythm comes from the chain in the next job and the schedule only restarts it.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rules/**
      - feed-builder/**

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: feed-build
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      # A scheduled run only publishes when the chain has stopped, so browsers stay one step behind and keep getting the small delta.
      - name: Check the secrets and the age of the live database
        id: secrets
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$ABUSECH_AUTH_KEY" ] || [ -z "$FEED_SIGNING_KEY" ]; then
            echo "::notice::ABUSECH_AUTH_KEY or FEED_SIGNING_KEY is not set, nothing was published"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            generated=$(curl -fsS https://xvoidbyte.github.io/ClickFixWarden/v1/meta.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["generated"])' || true)
            if [ -n "$generated" ] && [ $(( $(date +%s) - $(date -d "$generated" +%s) )) -lt 2700 ]; then
              echo "::notice::The live database from $generated is less than 45 minutes old, nothing was published"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Build and sign the database
        if: steps.secrets.outputs.ready == 'true'
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: npm run feed:build
      # Every address is looked up the way the extension does on a page visit, a miss is a builder bug and shows as a warning.
      - name: Check that the extension finds every address
        if: steps.secrets.outputs.ready == 'true'
        run: npm run feed:verify -- dist/site/v1 || echo "::warning::Some addresses in this database would not be found, see the step log"
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: feed-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Waits for the next :07 and starts the following run itself, a push never starts a chain.
  # Only the newest waiting job survives, so overlapping runs always leave exactly one chain.
  next:
    needs: build
    if: always() && github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: feed-next
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Wait for the next hour and start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          next=$(( now / 3600 * 3600 + 420 ))
          if [ "$next" -le "$now" ]; then next=$(( next + 3600 )); fi
          echo "Next run at $(date -u -d @$next +%H:%M) UTC"
          sleep $(( next - now ))
          gh workflow run feed.yml --ref main -R "$REPO"
